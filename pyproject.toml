[project]
name = "feastflow"
version = "0.1.0"
description = "End-to-end data engineering project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.118",
    "confluent-kafka>=2.16.0",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
feastflow = "feastflow:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
spark = [
    "delta-spark==3.2.1",
    "pyspark==3.5.3",
]

[tool.pytest.ini_options]
markers = ["integration: needs the compose stack running"]
addopts = "-m 'not integration'"
