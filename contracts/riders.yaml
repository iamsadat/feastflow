table: riders
version: 1
primary_key: [rider_id]
columns:
  rider_id:   {type: integer, nullable: false}
  name:       {type: string,  nullable: false}
  email:      {type: string,  nullable: true}
  phone:      {type: string,  nullable: false}
  address:    {type: string,  nullable: false}
  city:       {type: string,  nullable: false, enum: [Hyderabad, Bengaluru]}
  zip:        {type: string,  nullable: true, pattern: '^[0-9]{6}$'}
  status:     {type: string,  nullable: false, enum: [AVAILABLE, OFFLINE, ON_DELIVERY]}
  rating:     {type: decimal, nullable: true, min: 0, max: 5}
  created_at: {type: timestamp, nullable: false}
  updated_at: {type: timestamp, nullable: false}
