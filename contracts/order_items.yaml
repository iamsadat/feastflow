table: order_items
version: 1
primary_key: [order_item_id]
columns:
  order_item_id:    {type: integer, nullable: false}
  order_id:         {type: integer, nullable: false}
  item_id:          {type: integer, nullable: false}
  quantity:         {type: integer, nullable: false, min: 1}
  unit_price_paise: {type: integer, nullable: false, min: 1}
  discount_paise:   {type: integer, nullable: false, min: 0}
  tax_paise:        {type: integer, nullable: false, min: 0}
  created_at:       {type: timestamp, nullable: false}
  updated_at:       {type: timestamp, nullable: false}
